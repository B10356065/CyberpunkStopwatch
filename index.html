<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>賽博朋克碼錶 - Cyberpunk Stopwatch</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for Digital Display -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=VT323&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Custom Fonts */
        .font-digital {
            font-family: 'Orbitron', 'VT323', monospace;
        }

        /* Cyberpunk Glows & Borders */
        .neon-border-frame {
            position: relative;
            background: rgba(12, 16, 24, 0.92);
            border: 2px solid #00f0ff;
            box-shadow: 
                0 0 15px rgba(0, 240, 255, 0.3),
                inset 0 0 25px rgba(0, 240, 255, 0.15);
            clip-path: polygon(
                0 16px, 16px 0, 
                calc(100% - 16px) 0, 100% 16px, 
                100% calc(100% - 16px), calc(100% - 16px) 100%, 
                16px 100%, 0 calc(100% - 16px)
            );
        }

        .neon-border-frame::before {
            content: '';
            position: absolute;
            top: -2px; left: 50%;
            transform: translateX(-50%);
            width: 40%;
            height: 3px;
            background: #ff007f;
            box-shadow: 0 0 10px #ff007f, 0 0 20px #ff007f;
        }

        .neon-border-frame::after {
            content: '';
            position: absolute;
            bottom: -2px; left: 50%;
            transform: translateX(-50%);
            width: 40%;
            height: 3px;
            background: #00f0ff;
            box-shadow: 0 0 10px #00f0ff;
        }

        /* Cyberpunk Button Styles */
        .cyber-btn-main {
            background: linear-gradient(135deg, rgba(255, 230, 0, 0.1) 0%, rgba(255, 0, 127, 0.2) 100%);
            border: 2px solid #ffe600;
            color: #ffffff;
            text-shadow: 0 0 8px #ffe600, 0 0 15px #ff007f;
            box-shadow: 
                0 0 15px rgba(255, 230, 0, 0.4),
                inset 0 0 15px rgba(255, 0, 127, 0.3);
            transition: all 0.2s ease-in-out;
            clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
        }

        .cyber-btn-main:hover:not(:disabled) {
            background: linear-gradient(135deg, rgba(255, 230, 0, 0.3) 0%, rgba(255, 0, 127, 0.4) 100%);
            box-shadow: 
                0 0 25px rgba(255, 230, 0, 0.8),
                0 0 35px rgba(255, 0, 127, 0.6),
                inset 0 0 20px rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
            color: #ffffff;
        }

        .cyber-btn-reset {
            background: linear-gradient(135deg, rgba(255, 0, 127, 0.15) 0%, rgba(120, 0, 255, 0.2) 100%);
            border: 2px solid #ff007f;
            color: #ff80c0;
            text-shadow: 0 0 8px #ff007f;
            box-shadow: 
                0 0 12px rgba(255, 0, 127, 0.3),
                inset 0 0 12px rgba(120, 0, 255, 0.2);
            transition: all 0.2s ease-in-out;
            clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
        }

        .cyber-btn-reset:hover:not(:disabled) {
            background: linear-gradient(135deg, rgba(255, 0, 127, 0.35) 0%, rgba(120, 0, 255, 0.4) 100%);
            box-shadow: 
                0 0 22px rgba(255, 0, 127, 0.8),
                0 0 30px rgba(120, 0, 255, 0.5),
                inset 0 0 15px rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            color: #ffffff;
        }

        /* Disabled State */
        .cyber-btn-disabled {
            opacity: 0.35;
            cursor: not-allowed;
            border-color: #555566 !important;
            color: #777788 !important;
            text-shadow: none !important;
            box-shadow: none !important;
            background: rgba(30, 30, 45, 0.4) !important;
            transform: none !important;
        }

        /* Animated HUD Outer Ring Rotations */
        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes spin-reverse {
            from { transform: rotate(360deg); }
            to { transform: rotate(0deg); }
        }

        .hud-ring-1 {
            animation: spin-slow 20s linear infinite;
        }

        .hud-ring-2 {
            animation: spin-reverse 15s linear infinite;
        }

        /* Pulse glow animation for text */
        .glow-text {
            text-shadow: 
                0 0 5px #00f0ff,
                0 0 12px #00f0ff,
                0 0 25px rgba(0, 240, 255, 0.8);
        }

        /* Background grid effect */
        .cyber-grid {
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgba(0, 240, 255, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 240, 255, 0.05) 1px, transparent 1px);
        }
    </style>
</head>
<body class="bg-gray-950 text-white min-h-screen flex items-center justify-center p-4 cyber-grid select-none">

    <!-- Container matching Reference Image Ratio (3:4 or sleek card frame) -->
    <div class="relative w-full max-w-md aspect-[3/4] min-h-[580px] p-6 sm:p-8 flex flex-col justify-between items-center neon-border-frame rounded-2xl">
        
        <!-- Decorative Cyber Corners -->
        <div class="absolute top-2 left-2 w-3 h-3 border-t-2 border-l-2 border-cyan-400"></div>
        <div class="absolute top-2 right-2 w-3 h-3 border-t-2 border-r-2 border-fuchsia-500"></div>
        <div class="absolute bottom-2 left-2 w-3 h-3 border-b-2 border-l-2 border-cyan-400"></div>
        <div class="absolute bottom-2 right-2 w-3 h-3 border-b-2 border-r-2 border-fuchsia-500"></div>

        <!-- Top Header / Frame Accent -->
        <div class="w-full flex justify-between items-center pt-1 border-b border-cyan-500/20 pb-3">
            <div class="flex items-center space-x-2">
                <i data-lucide="cpu" class="w-4 h-4 text-cyan-400 animate-pulse"></i>
                <span class="text-xs tracking-widest text-cyan-400/80 font-mono">CHRONO_SYS</span>
            </div>
            <div class="flex items-center space-x-1.5 text-xs font-mono text-fuchsia-400/80 tracking-widest">
                <i data-lucide="activity" class="w-3.5 h-3.5 text-fuchsia-400"></i>
                <span>FPS: <span id="fpsCounter">60</span></span>
            </div>
        </div>

        <!-- Central Futuristic Circle Display (Timer Area) -->
        <div class="relative my-auto w-64 h-64 sm:w-72 sm:h-72 flex items-center justify-center">
            
            <!-- Rotating HUD Circles -->
            <svg class="absolute inset-0 w-full h-full hud-ring-1" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="46" fill="none" stroke="#00f0ff" stroke-width="0.7" stroke-dasharray="8 4 2 4" opacity="0.6" />
                <circle cx="50" cy="50" r="42" fill="none" stroke="#ff007f" stroke-width="0.5" stroke-dasharray="15 8" opacity="0.4" />
            </svg>

            <svg class="absolute inset-0 w-full h-full hud-ring-2" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="38" fill="none" stroke="#00f0ff" stroke-width="0.8" stroke-dasharray="30 10 5 10" opacity="0.5" />
            </svg>

            <!-- Inner Static Glow Circle -->
            <div class="absolute w-48 h-48 sm:w-56 sm:h-56 rounded-full border border-cyan-500/30 bg-black/50 backdrop-blur-sm shadow-[0_0_30px_rgba(0,240,255,0.15)] flex flex-col items-center justify-center"></div>

            <!-- Side HUD Arc Indicators -->
            <div class="absolute -left-3 top-1/2 -translate-y-1/2 h-16 w-1 border-l-2 border-cyan-400/70"></div>
            <div class="absolute -right-3 top-1/2 -translate-y-1/2 h-16 w-1 border-r-2 border-fuchsia-500/70"></div>

            <!-- Digital Time Display -->
            <div class="relative z-10 text-center flex flex-col items-center">
                <!-- Mini Timer Icon Header -->
                <div class="mb-1 text-cyan-400/70 flex items-center justify-center space-x-1">
                    <i data-lucide="timer" class="w-4 h-4"></i>
                    <span class="text-[10px] font-mono tracking-widest">STOPWATCH</span>
                </div>

                <div id="display" class="font-digital text-2xl sm:text-3xl font-bold tracking-wider text-cyan-300 glow-text">
                    00:00:00:00
                </div>
                <div class="text-[10px] tracking-[0.3em] font-mono text-cyan-400/60 mt-2">
                    HRS : MIN : SEC : MS
                </div>
            </div>
        </div>

        <!-- Control Buttons Section -->
        <div class="w-full space-y-4 pb-2">
            
            <!-- Main Action Button (Start
